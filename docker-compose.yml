# anan-agent 基础设施层：数据库 / OCR / 采集器 / 后端
# 端口统一分配在 9000 段，与本机其他服务（如本地 PG 5432）隔离：
#   9001 = postgres | 9002 = tiktok-downloader | 9003 = rapidocr
#   8000 = backend（生产容器化用；开发期仍建议本地跑，见 README）

services:
  postgres:
    image: pgvector/pgvector:pg18   # 自带 pgvector 扩展
    container_name: anan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"   # 与 backend/.env 的 DATABASE_URL 保持一致
      POSTGRES_DB: anan_agent
    ports:
      - "9001:5432"                 # 宿主 9001 → 容器 5432（避开本地 PG）
    volumes:
      - pgdata:/var/lib/postgresql   # PG18 镜像要求挂在父目录（官方变更）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anan_agent"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rapidocr:
    image: rapidocr-api:local       # 本地构建的镜像（RapidAI/RapidOCRAPI）
    container_name: anan-rapidocr
    ports:
      - "9003:9003"                 # API 文档: http://localhost:9003/docs
    restart: unless-stopped

  tiktok-downloader:
    image: joeanamier/tiktok-downloader:latest
    container_name: anan-tiktok-downloader
    ports:
      - "9002:5555"                 # 宿主 9002 → 容器 5555，API 文档: http://localhost:9002/docs
    volumes:
      - tt-data:/app/Volume
      - video-data:/data            # 下载的视频写进共享卷，后端容器读同一路径
    # 以 Web API 模式运行，后端通过 HTTP 调用
    restart: unless-stopped

  # 生产部署用：docker compose up -d backend（开发期本地 python run.py 即可，不必启动它）
  backend:
    build: ./backend
    container_name: anan-backend
    environment:
      # 容器内覆盖 .env：地址指向 compose 内部服务名
      DATABASE_URL: postgresql+psycopg2://postgres:123456@postgres:5432/anan_agent
      DOUYIN_API_URL: http://tiktok-downloader:5555
      OCR_API_URL: http://rapidocr:9003/ocr
      DATA_DIR: /data               # 与下载器挂载点一致，视频路径两侧通用
    ports:
      - "8000:8000"
    volumes:
      - video-data:/data            # 与 tiktok-downloader 共享：它下载、它读取
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  tt-data:
  video-data:
